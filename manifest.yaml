  lat: LATITUDE
  lon: LONGITUDE
tables:
  # - RP_ALL_OWNERS
  # - RP_ALL_SITE_ADDRESSES
  - RP_BUILDING
  - RP_EXEMPTIONS
  # - RP_EXTRA_FEATURES
  # - RP_INACTIVE_PARCEL_LIST
